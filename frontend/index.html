<!DOCTYPE html>
<head>
    <meta charset='UTF-8'>
    <title>天外计算机社粘贴板</title>
    <meta name='viewport' content='width=device-width, initial-scale=1, shrink-to-fit=no'>
    <link rel='icon' href='{{FAVICON}}' type='image/png' />
    <style media='screen'>
        {{CSS}}
    </style>
</head>
<html lang='zh-CN'>
<body>
<div class='px-3 my-5 markdown-body'>
    <h1>天外计算机社粘贴板</h1>
    <p>本服务由广州市天河外国语学校计算机社团提供，基于Cloudflare Workers构建的开源粘贴板。</p>
    <p><b>使用方法</b>: 在此粘贴任意文本，提交后通过生成的URL分享</p>
    <p><b>重要提示</b>: 仅限临时分享，文件可能被不定期清理！</p>
    <p>访问<a href='{{REPO}}'>GitHub仓库</a>获取技术细节</p>

    <div id='paste-input-panel'>
        <div id='paste-header'>
            <div class='paste-header-tabs'>
                <div class="paste-tab enabled" id='paste-tab-edit'>编辑内容</div>
                <label for='paste-file-upload' id='paste-tab-file' class='paste-tab'>
                    <input type='file' placeholder='' id='paste-file-upload'>
                    <label for='paste-file-upload'>上传文件</label>
                </label>
            </div>
        </div>
        <div class="paste-tab-page enabled" id='paste-edit'>
            <textarea placeholder='在此输入或粘贴您的内容' id='paste-textarea' name='c' rows='20'></textarea>
        </div>
        <div class='paste-tab-page' id='paste-file-show'>
            <p id='paste-file-line'>
                <code class='file-name'></code>: <span class='file-size'></span>
            </p>
        </div>
    </div>

    <div id='paste-setting-panel'>
        <h2>设置选项</h2>
        <div id='paste-expiration-panel' class='paste-setting-subitem-panel'>
            <input list='expiration-choices' type='text' min='60' step='1' name='paste-expiration'
                   id='paste-expiration-input' placeholder='过期时间（示例：7d）' value='7d'>
            <label class='small-label' for='paste-expiration-input'>设置内容保留时间（留空则永久保存）<br>时间单位：s(秒), m(分), h(小时), d(天), M(月), Y(年)</label>
        </div>
        <div id='paste-passwd-panel' class='paste-setting-subitem-panel'>
            <input type='text' spellcheck='false' name='paste-expiration' id='paste-passwd-input' placeholder='管理密码'>
            <label class='small-label' for='paste-passwd-input'>用于删除或更新内容的密码（默认随机生成）</label>
        </div>
        <div class='label-line'>
            <input type='radio' name='url-type' value='short' id='paste-url-short-radio' checked>
            <label for='paste-url-short-radio' class='radio-label'>生成短链接</label>
            <span class='small-label'>示例：{{BASE_URL}}/BxWH</span>
        </div>
        <div class='label-line'>
            <input type='radio' name='url-type' value='long' id='paste-url-long-radio'>
            <label for='paste-url-long-radio' class='radio-label'>生成长链接</label>
            <span class='small-label'>示例：{{BASE_URL}}/5HQWYNmjA4h44SmybeThXXAm</span>
        </div>
        <div class='label-line'>
            <input type='radio' name='url-type' value='custom' id='paste-url-custom-radio'>
            <label for='paste-url-custom-radio' class='radio-label'>自定义路径</label>
            <div id='paste-url-input-wrapper'>
                <span id='paste-url-input-prefix'>{{BASE_URL}}/~</span>
                <input type='text' id='paste-custom-url-input' minlength='3' name='custom-url'>
            </div>
            <span class='small-label'>示例：{{BASE_URL}}/~myproject</span>
        </div>
        <div class='label-line'>
            <input type='radio' name='url-type' value='admin' id='paste-url-admin-radio'>
            <label for='paste-url-admin-radio' class='radio-label'>管理现有内容</label>
            <input type='url' spellcheck='false' id='paste-admin-url-input'
                   name='admin-url' value='{{BASE_URL}}'>
        </div>
    </div>
    <div id='paste-uploaded-panel' class='hidden'>
        <h2>上传成功</h2>
        <div class='uploaded-entry'>
            <input id='uploaded-url' type='text' class='uploaded-table-text' readonly>
            <button class='copy-button'>复制</button>
        </div>
        <label for='uploaded-url' class='small-label'>内容地址</label>
        <div class='uploaded-entry'>
            <input id='uploaded-admin-url' type='text' class='uploaded-table-text' readonly>
            <button class='copy-button'>复制</button>
        </div>
        <label for='suggest-url' class='small-label'>管理地址</label>
        <div class='uploaded-entry'>
            <input id='uploaded-suggest-url' type='text' class='uploaded-table-text' readonly>
            <button class='copy-button'>复制</button>
        </div>
        <label for='uploaded-admin-url' class='small-label'>推荐地址</label>
        <div class='uploaded-entry'>
            <input type='text' id='uploaded-expiration' class='uploaded-table-text' readonly>
        </div>
        <label for='uploaded-expiration' class='small-label'>过期时间</label>
    </div>
    <div>
        <button id='submit-button' class='long-button px-3 py-2 my-1'>立即提交</button>
        <button id='delete-button' class='long-button hidden px-3 py-2 my-1'>删除内容</button>
        <span id='submit-error-msg'></span>
    </div>
</div>
<footer class='px-3 my-2 text-center'>
    <p>
        <a href='{{BASE_URL}}/tos' class='d-inline-block'>服务条款</a>
        /
        <a href='{{BASE_URL}}/api' class='d-inline-block'>API文档</a>
        <br>
        <span class='service-credit'>由广州市天河外国语学校计算机社团提供服务</span>
    </p>
</footer>
<script src='https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js'></script>
<script>
    {{INDEX_JS}}
</script>
</body>
</html>
